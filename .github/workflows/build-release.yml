name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
       
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==4.2.2
          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest --windows-console-mode=disable `
            --windows-icon-from-ico="icon.ico" `
            --output-filename="HOTS Uninstaller.exe" `
            --output-dir=dist `
            --include-data-files="hots_uninstaller/graphic/logo.png=graphic/logo.png" `
            --include-data-files="hots_uninstaller/graphic/logo1.png=graphic/logo1.png" `
            --include-data-files="hots_uninstaller/graphic/logo.ico=graphic/logo.ico" `
            --include-data-files="hots_uninstaller/graphic/logoS.png=graphic/logoS.png" `
            --include-data-files="hots_uninstaller/graphic/paypal_donate_button.png=graphic/paypal_donate_button.png" `
            --include-data-files="hots_uninstaller/graphic/support_me_on_kofi_dark.png=graphic/support_me_on_kofi_dark.png" `
            --include-package-data=certifi `
            --enable-plugin=pyside6 `
            --nofollow-import-to=PIL `
            --nofollow-import-to=scipy `
            --nofollow-import-to=colorthief `
            hots_uninstaller_launcher.pyw

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: iscc setup.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Output/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Output/*.exe
